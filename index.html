<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary p-5">Expense Tracker</h1>
        <form id="userform">
            <div class="row my-5 ">
                <div class="col-lg-3">
                    <input id="Expname" type="text" placeholder="Enter your Expense name" class="form-control">
                </div>
                <div class="col-lg-3">
                    <input id="Expamount" type="number" placeholder="Amount" class="form-control">
                </div>              
                
                <div class="col-lg-3">
                    <select name="" id="category" class="form-control" >
                        <option value="" hidden>Category</option>
                        <option value="Electronics" >Electronics</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Clothing">Clothing</option>                  
                     
                    </select>
                </div>
                <div class="col-lg-3">
                    <input type="date" placeholder="Date" class="form-control">
                </div>
               
                <button   class="btn btn-success" >Save</button>
                
            </div>
        </form>
    </div>
    
        <table class=" my-5 d-flex justify-content-center w-100 table table-bordered">
            <thead class="text-bordered">
                <tr>
                    <th>#</th>
                    <th>ExpName</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="tablebody">
                
            </tbody>
        </table>
     
</body>
<script src="./main.js"></script>
</html>
